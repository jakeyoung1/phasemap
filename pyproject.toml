[project]
name = "phasemap"
version = "0.1.0"
description = "Soccer phase-of-play analyzer: tracking data in, measured facts and an evidence-checked AI breakdown out."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phasemap = "phasemap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phasemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
